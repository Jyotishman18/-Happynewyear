<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catch Me If You Can 😈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1 class="title">💞 Always You 💞</h1>

  <p class="message">
    This button will never surrender 😏<br><br>
    If you catch it…<br>
    you deserve the secret ❤️
  </p>

  <button class="btn escape-btn" id="escapeBtn">
    Catch Me 😜
  </button>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h2>Cutiepieeeee❤️</h2>
    <p>
      You actually did it 😳💖<br><br>
      I choose you.<br>
      Always.
    </p>
    <button class="btn" onclick="closePopup()">Close 💕</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
